"target":"C","lowpass":false,"context":"biased","sentence_bias":"T1","contour":"C24","melody":"L_H","rec2":"san 3d","rec5":"san 6d","word_pos2":3,"length2":4,"word_pos5":3,"length5":4},{"condition":"C5","position":"medial","word":"xiang","target":"G","lowpass":false,"context":"neutral","sentence_bias":"neutral","contour":"C5","melody":"H_L","rec2":"xiang 3e","rec5":"xiang 6e","word_pos2":5,"length2":7,"word_pos5":5,"length5":7},{"condition":"C5 LP","position":"medial","word":"xiang","target":"G","lowpass":true,"context":"low-passed","sentence_bias":"neutral","contour":"C5","melody":"H_L","rec2":"xiang 3e","rec5":"xiang 6e","word_pos2":5,"length2":7,"word_pos5":5,"length5":7},{"condition":"C5","position":"medial","word":"shu","target":"A","lowpass":false,"context":"neutral","sentence_bias":"neutral","contour":"C5","melody":"H_L","rec2":"shu 3e","rec5":"shu 6e","word_pos2":5,"length2":7,"word_pos5":5,"length5":7},{"condition":"C5 LP","position":"medial","word":"shu","target":"A","lowpass":true,"context":"low-passed","sentence_bias":"neutral","contour":"C5","melody":"H_L","rec2":"shu 3e","rec5":"shu 6e","word_pos2":5,"length2":7,"word_pos5":5,"length5":7},{"condition":"C5","position":"medial","word":"gou","target":"G","lowpass":false,"context":"neutral","sentence_bias":"neutral","contour":"C5","melody":"H_L","rec2":"gou 3e","rec5":"gou 6e","word_pos2":5,"length2":7,"word_pos5":5,"length5":7},{"condition":"C5 LP","position":"medial","word":"gou","target":"G","lowpass":true,"context":"low-passed","sentence_bias":"neutral","contour":"C5","melody":"H_L","rec2":"gou 3e","rec5":"gou 6e","word_pos2":5,"length2":7,"word_pos5":5,"length5":7},{"condition":"C5","position":"medial","word":"san","target":"A","lowpass":false,"context":"neutral","sentence_bias":"neutral","contour":"C5","melody":"H_L","rec2":"san 3e","rec5":"san 6e","word_pos2":5,"length2":7,"word_pos5":5,"length5":7},{"condition":"C5 LP","position":"medial","word":"san","target":"A","lowpass":true,"context":"low-passed","sentence_bias":"neutral","contour":"C5","melody":"H_L","rec2":"san 3e","rec5":"san 6e","word_pos2":5,"length2":7,"word_pos5":5,"length5":7},{"condition":"C6","position":"medial","word":"xiang","target":"G","lowpass":false,"context":"neutral","sentence_bias":"neutral","contour":"C6","melody":"L_H","rec2":"xiang 3f","rec5":"xiang 6f","word_pos2":5,"length2":7,"word_pos5":5,"length5":7},{"condition":"C6 LP","position":"medial","word":"xiang","target":"G","lowpass":true,"context":"low-passed","sentence_bias":"neutral","contour":"C6","melody":"L_H","rec2":"xiang 3f","rec5":"xiang 6f","word_pos2":5,"length2":7,"word_pos5":5,"length5":7},{"condition":"C6","position":"medial","word":"shu","target":"A","lowpass":false,"context":"neutral","sentence_bias":"neutral","contour":"C6","melody":"L_H","rec2":"shu 3f","rec5":"shu 6f","word_pos2":5,"length2":7,"word_pos5":5,"length5":7},{"condition":"C6 LP","position":"medial","word":"shu","target":"A","lowpass":true,"context":"low-passed","sentence_bias":"neutral","contour":"C6","melody":"L_H","rec2":"shu 3f","rec5":"shu 6f","word_pos2":5,"length2":7,"word_pos5":5,"length5":7},{"condition":"C6","position":"medial","word":"gou","target":"G","lowpass":false,"context":"neutral","sentence_bias":"neutral","contour":"C6","melody":"L_H","rec2":"gou 3f","rec5":"gou 6f","word_pos2":5,"length2":7,"word_pos5":5,"length5":7},{"condition":"C6 LP","position":"medial","word":"gou","target":"G","lowpass":true,"context":"low-passed","sentence_bias":"neutral","contour":"C6","melody":"L_H","rec2":"gou 3f","rec5":"gou 6f","word_pos2":5,"length2":7,"word_pos5":5,"length5":7},{"condition":"C6","position":"medial","word":"san","target":"A","lowpass":false,"context":"neutral","sentence_bias":"neutral","contour":"C6","melody":"L_H","rec2":"san 3f","rec5":"san 6f","word_pos2":5,"length2":7,"word_pos5":5,"length5":7},{"condition":"C6 LP","position":"medial","word":"san","target":"A","lowpass":true,"context":"low-passed","sentence_bias":"neutral","contour":"C6","melody":"L_H","rec2":"san 3f","rec5":"san 6f","word_pos2":5,"length2":7,"word_pos5":5,"length5":7}].filter(s => INCLUDE_LOWPASS || !s.lowpass);

// =============================================================================
// GROUP: 2-semitone or 5-semitone
//   Link with ?group=2 or ?group=5 to choose the group.
//   Without it: DataPipe assigns groups in turn (if DATAPIPE_ID is set),
//   otherwise the group is picked at random.
// =============================================================================
const jsPsych = initJsPsych({ on_finish: () => {} });
const params = new URLSearchParams(window.location.search);
let GROUP = ["2", "5"].includes(params.get("group")) ? params.get("group") : null;
const PARTICIPANT = params.get("PROLIFIC_PID") || params.get("id") || jsPsych.randomization.randomID(10);

// =============================================================================
// ORDER: blocks in random order; random order within each block under 4 rules
// =============================================================================
function okNext(seq, x) {
  if (seq.length === 0) return true;
  const p = seq[seq.length - 1];
  if (p.word === x.word) return false;                       // same word twice in a row
  if (p.contour === x.contour) return false;                 // same melodic contour twice in a row
  if (seq.length >= 2) {
    const q = seq[seq.length - 2];
    if (q.target === p.target && p.target === x.target) return false;   // >2 same target note in a row
    if (q.lowpass && p.lowpass && x.lowpass) return false;               // >2 low-passed in a row
  }
  return true;
}
function orderBlock(pool) {
  for (let attempt = 0; attempt < 10000; attempt++) {
    const left = jsPsych.randomization.shuffle(pool.slice());
    const seq = [];
    while (left.length) {
      const ok = left.filter(x => okNext(seq, x));
      if (!ok.length) break;
      const pick = ok[Math.floor(Math.random() * ok.length)];
      seq.push(pick); left.splice(left.indexOf(pick), 1);
    }
    if (seq.length === pool.length) return seq;
  }
  throw new Error("Could not build an order that satisfies the rules");
}
const BLOCK_ORDER = jsPsych.randomization.shuffle(["final", "initial", "medial"]);
const ORDERED = BLOCK_ORDER.map(pos => orderBlock(STIMULI.filter(s => s.position === pos)));

// =============================================================================
// SCREENS
// =============================================================================
const ORDINAL = { 1: "first", 2: "second", 3: "third", 4: "fourth", 5: "fifth", 6: "sixth", 7: "seventh" };
function question(item) {
  if (item.position === "final") return "What is the last word you hear?";
  if (item.position === "initial") return "What is the first word you hear?";
  return `What is the ${ORDINAL[item["word_pos" + GROUP]]} word you hear?`;
}
const fileOf = item => {
  const [word, code] = item["rec" + GROUP].split(" ");
  return audioFile(word, code, item.lowpass);
};

const BLOCK_TEXT = {
  final:   "In this section, identify the meaning of the last word that you hear.",
  initial: "In this section, identify the meaning of the first word that you hear.",
  medial:  "In this section, you will identify the meaning of words in the middle of the phrase. " +
           "Before each phrase, you will be told which word to listen for."
};

const welcome = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `<p class="instructions">You are about to participate in an experiment about identifying

             the word that you hear. A word may be correct more than once or not at all.</p>`,
  choices: ["Start"]
};

// Ask DataPipe for a group (alternates 0, 1, 0, 1, ...). If DataPipe doesn't answer within
// 8 seconds, or condition assignment is switched off, the group is picked at random instead.
async function postJSON(url, body, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { method: "POST", signal: ctrl.signal,
      headers: { "Content-Type": "application/json", Accept: "*/*" }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    return r.ok ? j : Object.assign({ error: "HTTP " + r.status }, j);
  } catch (e) { return { error: String(e) }; }
  finally { clearTimeout(timer); }
}
let GROUP_SOURCE = GROUP ? "link" : null;
const assignGroup = {
  type: jsPsychHtmlKeyboardResponse, choices: "NO_KEYS",
  stimulus: "<p>Loading…</p>",
  data: { task: "setup" },
  on_load: async () => {
    if (GROUP === null && DATAPIPE_ID !== "") {
      const res = await postJSON("https://pipe.jspsych.org/api/condition/", { experimentID: DATAPIPE_ID }, 8000);
      if (res && !res.error && Number.isInteger(res.condition)) {
        GROUP = res.condition === 1 ? "5" : "2"; GROUP_SOURCE = "datapipe";
      }
    }
    if (GROUP === null) { GROUP = Math.random() < 0.5 ? "2" : "5"; GROUP_SOURCE = "random"; }
    jsPsych.data.addProperties({ participant_id: PARTICIPANT, group: GROUP + "st", group_source: GROUP_SOURCE,
                                 block_order: BLOCK_ORDER.join(" > "), lowpass_included: INCLUDE_LOWPASS });
    jsPsych.finishTrial();
  }
};

const preload = {
  type: jsPsychPreload,
  audio: () => STIMULI.map(fileOf),
  message: "<p>Loading audio…</p>",
  show_progress_bar: true
};

// Before loading, check that every audio file exists. If any are missing,
// stop and list the missing file names on screen.
let MISSING = [];
const checkFiles = {
  type: jsPsychHtmlKeyboardResponse, choices: "NO_KEYS",
  stimulus: "<p>Checking audio files…</p>",
  data: { task: "setup" },
  on_load: async () => {
    const files = STIMULI.map(fileOf);
    const ok = await Promise.all(files.map(f =>
      fetch(f, { method: "HEAD", cache: "no-store" }).then(r => r.ok).catch(() => false)));
    MISSING = files.filter((f, i) => !ok[i]);
    jsPsych.finishTrial();
  }
};
const missingFiles = {
  timeline: [{
    type: jsPsychHtmlKeyboardResponse, choices: "NO_KEYS",
    stimulus: () => `<p><b>${MISSING.length} audio file(s) could not be found:</b></p>
      <div style="text-align:left; max-height:60vh; overflow:auto; font-family:monospace">
      ${MISSING.map(f => decodeURI(f)).join("<br>")}</div>`
  }],
  conditional_function: () => MISSING.length > 0
};

function trialsFor(item) {
  const choices = CHOICES[item.word];
  const greyButtons = `<div class="jspsych-btn-group-flex">` +
    choices.map(([c]) => `<button class="jspsych-btn" tabindex="-1" style="margin:0.75em; pointer-events:none">${c}</button>`).join("") +
    `</div>`;
  return [
    {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: () => greyButtons + `<p class="question">${question(item)}</p><p style="color:#888">Get ready to listen…</p>`,
      choices: "NO_KEYS", trial_duration: PREVIEW_MS, data: { task: "preview" }
    },
    {
      type: jsPsychAudioButtonResponse,
      stimulus: () => fileOf(item),
      prompt: () => `<p class="question">${question(item)}</p>`,
      choices: choices.map(([c]) => c),
      response_allowed_while_playing: false,
      data: { task: "tone" },
      on_finish: d => Object.assign(d, {
        answer: choices[d.response][1], answer_label: choices[d.response][0],
        file: fileOf(item), recording: item["rec" + GROUP],
        condition: item.condition, position: item.position, word: item.word, target: item.target,
        context: item.context, sentence_bias: item.sentence_bias, melody: item.melody,
        contour: item.contour, lowpass: item.lowpass,
        target_word_position: item["word_pos" + GROUP], phrase_length: item["length" + GROUP],
        block: item._block, trial_in_block: item._k
      })
    }
  ];
}

const blocks = [];
BLOCK_ORDER.forEach((pos, b) => {
  blocks.push({
    type: jsPsychHtmlButtonResponse,
    stimulus: `<p style="color:#888">Part ${b + 1} of 3</p><p class="instructions">${BLOCK_TEXT[pos]}</p>`,
    choices: ["Begin"], data: { task: "block_instructions", position: pos }
  });
  ORDERED[b].forEach((item, k) => {
    blocks.push(...trialsFor({ ...item, _block: b + 1, _k: k + 1 }));
  });
});

const demographics = {
  type: jsPsychSurveyHtmlForm,
  preamble: "<h3>A few questions about you</h3>",
  html: `
    <div class="demo">
      <div class="q">Age</div>
      <input type="number" name="age" min="18" max="100" required>
      <div class="q">Gender</div>
      <input type="text" name="gender" required>
      <div class="q">How proficient are you in Mandarin?</div>
      <div class="scale">
        ${[1,2,3,4,5].map(n => `<label><input type="radio" name="mandarin_proficiency" value="${n}" required>${n}</label>`).join("")}
      </div>
      <div class="ends"><span>1 = can understand, but have difficulty speaking</span><span>5 = native</span></div>
      <div class="q">Do you have a musical background?</div>
      <label><input type="radio" name="music_background" value="yes" required> Yes</label>&nbsp;&nbsp;
      <label><input type="radio" name="music_background" value="no"> No</label>
      <div id="music_box" class="hidden">
        <div class="q" style="font-weight:400">If so, please briefly elaborate:</div>
        <textarea name="music_details" rows="3"></textarea>
      </div>
      <div class="q">Is Mandarin your first language?</div>
      <label><input type="radio" name="mandarin_L1" value="yes" required> Yes</label>&nbsp;&nbsp;
      <label><input type="radio" name="mandarin_L1" value="no"> No</label>
      <div id="l1_box" class="hidden">
        <div class="q" style="font-weight:400">If not, what is your first language?</div>
        <input type="text" name="first_language">
      </div>
    </div>`,
  button_label: "Submit",
  on_load: () => {
    const toggle = (name, showIf, boxId) => {
      document.querySelectorAll(`input[name=${name}]`).forEach(r =>
        r.addEventListener("change", () => {
          const box = document.getElementById(boxId), show = r.value === showIf;
          box.classList.toggle("hidden", !show);
          const field = box.querySelector("input, textarea");
          field.required = show; if (!show) field.value = "";
        }));
    };
    toggle("music_background", "yes", "music_box");
    toggle("mandarin_L1", "no", "l1_box");
  },
  data: { task: "demographics" },
  on_finish: d => jsPsych.data.addProperties(d.response)
};

// Save to DataPipe (tries 3 times, up to 30 s each). If it still fails, the CSV is downloaded
// on the participant's computer and they are asked to send it to you.
const dataCSV = () => jsPsych.data.get().filter({ task: "tone" }).csv();
let SAVED = false;
const saveData = {
  type: jsPsychHtmlKeyboardResponse, choices: "NO_KEYS",
  stimulus: "<p>Saving your responses… please do not close this page.</p>",
  data: { task: "setup" },
  on_load: async () => {
    if (DATAPIPE_ID !== "") {
      for (let attempt = 0; attempt < 3 && !SAVED; attempt++) {
        const res = await postJSON("https://pipe.jspsych.org/api/data/",
          { experimentID: DATAPIPE_ID, filename: `${PARTICIPANT}.csv`, data: dataCSV() }, 30000);
        SAVED = !!res && !res.error;
      }
    }
    if (!SAVED) jsPsych.data.get().filter({ task: "tone" }).localSave("csv", `${PARTICIPANT}_${GROUP}st.csv`);
    jsPsych.finishTrial();
  }
};
const saveFailed = {
  timeline: [{
    type: jsPsychHtmlButtonResponse, choices: [],
    stimulus: () => `<p class="instructions">Thank you for participating! Your responses could not be uploaded
      automatically, so a file named <b>${PARTICIPANT}_${GROUP}st.csv</b> has been downloaded to your computer
      (usually in your Downloads folder).</p>
      <p class="instructions">${CONTACT_EMAIL ? `Please email this file to <b>${CONTACT_EMAIL}</b>.`
                                               : "Please send this file to the researcher."}</p>`
  }],
  conditional_function: () => !SAVED && DATAPIPE_ID !== ""
};
const thanks = {
  timeline: [{
    type: jsPsychHtmlButtonResponse, choices: [],
    stimulus: "<p>Thank you for participating! You may now close this window.</p>"
  }],
  conditional_function: () => SAVED || DATAPIPE_ID === ""
};

jsPsych.run([welcome, assignGroup, checkFiles, missingFiles, preload, ...blocks, demographics, saveData, saveFailed, thanks]);
</script>
