// ORDER: blocks in random order; random order within each block under 4 rules
// =============================================================================
function okNext(seq, x) {
  if (seq.length === 0) return true;
  const p = seq[seq.length - 1];
  if (p.word === x.word) return false;                       // same word twice in a row
  if (p.contour === x.contour) return false;                 // same melodic contour twice in a row
  if (seq.length >= 2) {
    const q = seq[seq.length - 2];
    if (q.target === p.target && p.target === x.target) return false;   // >2 same target note in a row
    if (q.lowpass && p.lowpass && x.lowpass) return false;               // >2 low-passed in a row
  }
  return true;
}
function orderBlock(pool) {
  for (let attempt = 0; attempt < 10000; attempt++) {
    const left = jsPsych.randomization.shuffle(pool.slice());
    const seq = [];
    while (left.length) {
      const ok = left.filter(x => okNext(seq, x));
      if (!ok.length) break;
      const pick = ok[Math.floor(Math.random() * ok.length)];
      seq.push(pick); left.splice(left.indexOf(pick), 1);
    }
    if (seq.length === pool.length) return seq;
  }
  throw new Error("Could not build an order that satisfies the rules");
}

// Ask DataPipe for a group (alternates 0, 1, 0, 1, ...). If DataPipe doesn't answer within
// 8 seconds, or condition assignment is switched off, the group is picked at random instead.
async function postJSON(url, body, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { method: "POST", signal: ctrl.signal,
      headers: { "Content-Type": "application/json", Accept: "*/*" }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    return r.ok ? j : Object.assign({ error: "HTTP " + r.status }, j);
  } catch (e) { return { error: String(e) }; }
  finally { clearTimeout(timer); }
}

function breakTrial(q, b) {
  return {
    type: jsPsychSurveyHtmlForm,
    preamble: `<p style="color:#888">Short break</p>`,
    html: `<div class="demo"><div class="q">${q.text}</div>
           <textarea name="${q.name}" rows="3" required></textarea></div>`,
    button_label: "Continue",
    data: { task: "break_question", question: q.name, block: b + 1 },
    on_finish: d => jsPsych.data.addProperties({
      [q.name]: d.response[q.name],
      [q.name + "_block"]: b + 1
    })
  };
}

// Audio test: participants can play test.wav as often as they like, then confirm they can hear it.
let TEST_PLAYS = 0;
const audioTest = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <p class="instructions">Please be sure to wear headphones for this experiment.
       This is a test page to make sure that your audio is working.</p>
    <p><button type="button" class="jspsych-btn" id="play-test" style="font-size:20px">▶ Play audio</button></p>
    <p class="question">Can you hear this audio?</p>
    <p id="test-help" class="instructions" style="color:#9a4a0c; display:none">Please check that your headphones
       are connected and your volume is turned up, then press “Play audio” again.</p>`,
  choices: ["Yes", "No"],
  on_load: () => {
    const audio = new Audio(TEST_AUDIO);
    document.getElementById("play-test").onclick = () => { audio.currentTime = 0; audio.play(); TEST_PLAYS++; };
    // "No" doesn't move on: it shows advice so they can fix their audio and try again
    const btns = document.querySelectorAll("#jspsych-html-button-response-btngroup button");
    const no = btns[1];
    const clone = no.cloneNode(true); no.replaceWith(clone);
    clone.addEventListener("click", e => {
      e.stopPropagation();
      document.getElementById("test-help").style.display = "block";
      jsPsych.data.addProperties({ audio_test_said_no: true });
    });
  },
  data: { task: "audio_test" },
  on_finish: d => jsPsych.data.addProperties({ audio_test_plays: TEST_PLAYS })
};

const blocks = [];
BLOCK_ORDER.forEach((pos, b) => {
  blocks.push({
    type: jsPsychHtmlButtonResponse,
    stimulus: `<p style="color:#888">Part ${b + 1} of 3</p><p class="instructions">${BLOCK_TEXT[pos]}</p>`,
    choices: ["Begin"], data: { task: "block_instructions", position: pos }
  });
  const half = Math.ceil(ORDERED[b].length / 2);
  ORDERED[b].forEach((item, k) => {
    if (k === half) blocks.push(breakTrial(BREAK_QUESTIONS[b], b));
    blocks.push(...trialsFor({ ...item, _block: b + 1, _k: k + 1 }));
  });
});

const demographics = {
  type: jsPsychSurveyHtmlForm,
  preamble: "<h3>A few questions about you</h3>",
  html: `
    <div class="demo">
      <div class="q">Age</div>
      <input type="number" name="age" min="18" max="100" required>

      <div class="q">Gender</div>
      <input type="text" name="gender" required>

      <div class="q">How proficient are you in Mandarin?</div>
      <div class="scale">
        ${[1,2,3,4,5].map(n => `<label><input type="radio" name="mandarin_proficiency" value="${n}" required>${n}</label>`).join("")}
      </div>
      <div class="ends"><span>1 = can understand, but have difficulty speaking</span><span>5 = native</span></div>

      <div class="q">Do you speak Cantonese?</div>
      <label><input type="radio" name="cantonese" value="yes" required> Yes</label>&nbsp;&nbsp;
      <label><input type="radio" name="cantonese" value="no"> No</label>
      <div id="cantonese_box" class="hidden">
        <div class="q" style="font-weight:400">How proficient are you in Cantonese?</div>
        <div class="scale">
        ${[1,2,3,4,5].map(n => `<label><input type="radio" name="cantonese_proficiency" value="${n}" required>${n}</label>`).join("")}
      </div>
      <div class="ends"><span>1 = can understand, but have difficulty speaking</span><span>5 = native</span></div>
      </div>

      <div class="q">Is Mandarin your first language?</div>
      <label><input type="radio" name="mandarin_L1" value="yes" required> Yes</label>&nbsp;&nbsp;
      <label><input type="radio" name="mandarin_L1" value="no"> No</label>
      <div id="l1_box" class="hidden">
        <div class="q" style="font-weight:400">If not, what is your first language?</div>
        <input type="text" name="first_language">
      </div>

      <div class="q">Do you speak any other languages, and if so, which ones?</div>
      <textarea name="other_languages" rows="2" required></textarea>

      <div class="q">What country do you currently reside in?</div>
      <input type="text" name="country" required>

      <div class="q">Have you or do you currently play an instrument or sing?</div>
      <label><input type="radio" name="music_background" value="yes" required> Yes</label>&nbsp;&nbsp;
      <label><input type="radio" name="music_background" value="no"> No</label>
      <div id="music_box" class="hidden">
        <div class="q" style="font-weight:400">Please describe further: when and for how long? In what capacity
          (e.g. professionally, took lessons weekly, or recreationally)?</div>
        <textarea name="music_details" rows="3"></textarea>
      </div>

      <div class="q">Do you have any hearing or neurodevelopmental conditions (e.g., hearing impairment, ADHD, etc.)?
        If none, please write "None".</div>
      <textarea name="conditions" rows="2" required></textarea>

      <div class="q">Please enter your Prolific ID.</div>
      <input type="text" name="prolific_id" required value="${params.get("PROLIFIC_PID") || ""}">
    </div>`,
  button_label: "Submit",
  on_load: () => {
    // show a follow-up only for the answer that needs it; hidden follow-ups are not required and are cleared
    const toggle = (name, showIf, boxId) => {
      document.querySelectorAll(`input[name=${name}]`).forEach(r =>
        r.addEventListener("change", () => {
          const box = document.getElementById(boxId), show = r.value === showIf;
          box.classList.toggle("hidden", !show);
          box.querySelectorAll("input, textarea").forEach(f => {
            f.required = show;
            if (!show) { if (f.type === "radio") f.checked = false; else f.value = ""; }
          });
        }));
    };
    toggle("cantonese", "yes", "cantonese_box");
    toggle("mandarin_L1", "no", "l1_box");
    toggle("music_background", "yes", "music_box");
  },
  data: { task: "demographics" },
  on_finish: d => jsPsych.data.addProperties(Object.assign(
    { cantonese_proficiency: "", first_language: "", music_details: "" }, d.response))
};

const dataCSV = () => jsPsych.data.get().filter({ task: "tone" }).csv();
let SAVED = false;
const saveData = {
  type: jsPsychHtmlKeyboardResponse, choices: "NO_KEYS",
  stimulus: "<p>Saving your responses… please do not close this page.</p>",
  data: { task: "setup" },
  on_load: async () => {
    if (DATAPIPE_ID !== "") {
      for (let attempt = 0; attempt < 3 && !SAVED; attempt++) {
        const res = await postJSON("https://pipe.jspsych.org/api/data/",
          { experimentID: DATAPIPE_ID, filename: `${PARTICIPANT}.csv`, data: dataCSV() }, 30000);
        SAVED = !!res && !res.error;
      }
    }
    if (!SAVED) jsPsych.data.get().filter({ task: "tone" }).localSave("csv", `${PARTICIPANT}_${GROUP}st.csv`);
    jsPsych.finishTrial();
  }
};
const saveFailed = {
  timeline: [{

    stimulus: () => `<p class="instructions">Thank you for participating! Your responses could not be uploaded

      <a href="${COMPLETION_URL}">Click here to return to Prolific</a>.</p>`
  }],
  conditional_function: () => !SAVED && DATAPIPE_ID !== ""
};
const thanks = {
  timeline: [{
    type: jsPsychHtmlButtonResponse, choices: ["Return to Prolific"],
    stimulus: `<p class="instructions">Thank you for participating! Your responses have been saved.</p>
               <p class="instructions">Click the button below to return to Prolific and complete your submission.
               If it doesn't work, your completion code is <b>${COMPLETION_CODE}</b>.</p>`,
    on_finish: () => { window.location.href = COMPLETION_URL; }
  }],
  conditional_function: () => SAVED || DATAPIPE_ID === ""
};

jsPsych.run([consent, welcome, assignGroup, checkFiles, missingFiles, preload, audioTest, ...blocks, demographics, saveData, saveFailed, thanks]);
</script>
